name: Dependency Review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  check-dependency-review-support:
    runs-on: ubuntu-latest
    outputs:
      supported: ${{ steps.check.outputs.supported }}
    steps:
      - name: Check dependency review support
        id: check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: repo } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const isAdvancedSecurityEnabled = repo.security_and_analysis?.advanced_security?.status === "enabled";
            core.setOutput("supported", String(isAdvancedSecurityEnabled));

  dependency-review:
    needs: check-dependency-review-support
    if: needs.check-dependency-review-support.outputs.supported == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, LGPL-2.0
